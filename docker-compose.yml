version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: group-management-postgres
    environment:
      POSTGRES_DB: group_management
      POSTGRES_USER: group_management
      POSTGRES_PASSWORD: group_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U group_management -d group_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: group-management-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
